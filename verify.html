<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#46bce9"><title>Verifikasi Akun — AERIS Finance</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 0% 0%,#daf3ff,transparent 40%),linear-gradient(130deg,#f5fbff,#fff);font-family:'Plus Jakarta Sans',sans-serif;color:#173b55}.card{width:min(485px,100%);background:#fff;border:1px solid #dcf0fb;border-radius:26px;padding:30px;box-shadow:0 22px 70px #0e619220}.mark{width:52px;height:52px;display:grid;place-items:center;background:linear-gradient(135deg,#1b9bd4,#77daf7);color:white;border-radius:16px;font-size:27px;font-weight:800;box-shadow:0 9px 23px #1ba6de37}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;color:#369ccc;margin-top:20px}.card h1{font-size:28px;letter-spacing:-1px;margin:9px 0}.card p{color:#849caf;font-size:12px;line-height:1.8}.button{border:0;border-radius:12px;background:linear-gradient(105deg,#168dc5,#56c7f0);padding:14px 17px;color:#fff;cursor:pointer;font:800 12px 'Plus Jakarta Sans';width:100%;margin-top:13px}.secondary{background:#f2faff;border:1px solid #d9eef9;color:#1985bb}.field{display:block;margin-top:17px}.field span{font-size:10px;font-weight:800;display:block;margin-bottom:8px}.field input{border:1px solid #dcecf6;border-radius:12px;padding:13px 14px;width:100%;outline:none;font:600 12px 'Plus Jakarta Sans'}.notice{border-radius:12px;padding:12px;margin-top:16px;background:#f4fbff;border:1px solid #dbeef9;font-size:11px;line-height:1.7}.notice.error{background:#fff4f6;border-color:#f4d7de;color:#b73650}[hidden]{display:none!important}</style></head>
<body><main class="card"><div class="mark">A</div><div class="eyebrow">AERIS · ACCOUNT SECURITY</div><h1 id="title">Verifikasi email</h1><p id="intro">Kami memastikan bahwa hanya pemilik email yang dapat mengakses data keuangan perusahaan.</p><div id="result" class="notice" role="status" aria-live="polite">Memeriksa tautan dan status akun…</div><form id="resetForm" hidden><label class="field"><span>Password baru (minimal 8 karakter)</span><input type="password" id="newPassword" autocomplete="new-password" minlength="8" required></label><label class="field"><span>Ulangi password baru</span><input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required></label><button class="button" type="submit" id="resetBtn">Simpan password baru</button></form><button class="button" type="button" id="checkBtn">Periksa kembali status email</button><button class="button secondary" type="button" id="resendBtn">Kirim ulang verifikasi</button><a class="button secondary" style="display:block;text-align:center;text-decoration:none" href="./index.html">Kembali ke login</a></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,applyActionCode,checkActionCode,verifyPasswordResetCode,confirmPasswordReset,sendEmailVerification,signOut,reload} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const $=id=>document.getElementById(id),cfg=window.AERIS_CONFIG||{};let auth=null;try{auth=getAuth(initializeApp(cfg.firebase));}catch(err){show('Konfigurasi Firebase belum lengkap: '+err.message,true);}
const params=new URLSearchParams(location.search),code=params.get('oobCode'),mode=params.get('mode');
function show(message,bad=false){$('result').textContent=message;$('result').className='notice'+(bad?' error':'');}
async function check(){if(!auth)return;try{if(!auth.currentUser){show('Belum ada sesi login. Jika sudah memverifikasi email, silakan kembali ke halaman login.',false);return;}await reload(auth.currentUser);if(auth.currentUser.emailVerified){show('Email sudah terverifikasi. Anda bisa membuka dashboard.',false);$('checkBtn').textContent='Buka Dashboard';$('checkBtn').onclick=()=>location.replace('main.html');}else show('Email belum diverifikasi. Buka tautan yang dikirim ke email kerja Anda.',false);}catch(e){show(e.message,true);}}
$('checkBtn').addEventListener('click',check);
$('resendBtn').addEventListener('click',async()=>{try{if(!auth?.currentUser)throw new Error('Silakan login kembali dahulu.');await sendEmailVerification(auth.currentUser,{url:new URL('./verify.html',location.href).href,handleCodeInApp:false});show('Tautan verifikasi baru telah dikirim. Periksa inbox dan spam.');}catch(e){show(e.message,true);}});
$('resetForm').addEventListener('submit',async e=>{e.preventDefault();const password=$('newPassword').value;if(password!==$('confirmPassword').value){show('Kedua password tidak cocok.',true);return;}$('resetBtn').disabled=true;try{await confirmPasswordReset(auth,code,password);show('Password berhasil diperbarui. Silakan login menggunakan password baru.');$('resetForm').hidden=true;}catch(e){show(e.message,true);}finally{$('resetBtn').disabled=false;}});
(async()=>{if(!auth)return;try{if(mode==='resetPassword'&&code){$('title').textContent='Reset password';$('intro').textContent='Buat password baru untuk mengamankan akun AERIS.';$('checkBtn').hidden=true;$('resendBtn').hidden=true;await verifyPasswordResetCode(auth,code);$('resetForm').hidden=false;show('Kode reset valid. Silakan masukkan password baru.');return;}if(mode==='verifyEmail'&&code){$('resendBtn').hidden=true;await applyActionCode(auth,code);show('Alamat email berhasil diverifikasi. Kembali ke halaman login atau masuk ke dashboard.');await check();return;}if(mode==='recoverEmail'&&code){$('title').textContent='Pemulihan email';$('resendBtn').hidden=true;await checkActionCode(auth,code);show('Tautan pemulihan email terdeteksi. Hubungi administrator Firebase untuk proses pemulihan lanjutan.');return;}await check();}catch(e){show('Tautan mungkin sudah kedaluwarsa atau tidak valid: '+e.message,true);}})();
</script></body></html>
