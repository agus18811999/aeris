<div class="workspace"><header class="topbar"><button id="menuBtn" class="burger" type="button" aria-label="Buka menu">☰</button><div class="crumb"><div class="crumb-icon">✦</div><div style="min-width:0"><div class="crumb-kicker">CORPORATE FINANCE WORKSPACE</div><div class="crumb-label">AERIS / <span id="crumb">Dashboard</span></div></div></div><div class="top-actions"><span class="status" id="sync"><span class="live"></span>Terhubung</span><button id="quickAdd" class="top-btn primary" type="button">＋ <span class="quick-label">Transaksi Baru</span></button><button id="refreshBtn" class="top-btn" title="Sinkronkan data" type="button">↻</button><button class="top-btn top-profile" id="profileBtn" type="button"><span class="avatar" id="avatar">A</span><span class="top-profile-label" id="profileName">Akun</span></button></div></header><main class="content" id="content" tabindex="-1"><div class="screen-loader"><div class="sk-big skeleton"></div><div class="sk-row skeleton"></div></div></main></div></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,getIdToken,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const cfg=window.AERIS_CONFIG||{},$=id=>document.getElementById(id), fmt=new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});
const sections=[{label:'OVERVIEW',items:[['dashboard','Dashboard','▦'],['cashflow','Cash Flow','⌁']]},{label:'BUSINESS OPERATIONS',items:[['transactions','Transactions','⇄'],['accounts','Accounts & Banks','▣'],['invoices','Accounts Receivable','↙'],['bills','Accounts Payable','↗'],['contacts','Customers & Vendors','♧']]},{label:'PLANNING & CONTROL',items:[['budgets','Budgets & Forecast','◫'],['departments','Departments','▥'],['recurring','Recurring Rules','◷'],['approvals','Expense Approvals','✓'],['payroll','Payroll Planning','▤'],['taxes','Tax Obligations','⊕']]},{label:'INTELLIGENCE',items:[['reports','Financial Reports','▥']]},{label:'ORGANIZATION',items:[['team','Team & Access','♙'],['audit','Audit Trail','◴'],['settings','Settings','⚙']]}];
const VIEW_TABLE={transactions:'Transactions',accounts:'Accounts',invoices:'Invoices',bills:'Bills',budgets:'Budgets',departments:'Departments',contacts:'Contacts',recurring:'Recurring',approvals:'Approvals',payroll:'Payroll',taxes:'Taxes'};
const TITLES={dashboard:'Executive Dashboard',cashflow:'Cash Flow Analytics',transactions:'Cash Transactions',accounts:'Accounts & Banks',invoices:'Accounts Receivable',bills:'Accounts Payable',contacts:'Customers & Vendors',budgets:'Department Budgets',departments:'Departments',recurring:'Recurring Transactions',approvals:'Expense Approvals',payroll:'Payroll Planning',taxes:'Tax Obligations',reports:'Financial Reports',team:'Team & Access',audit:'Audit Trail',settings:'Workspace Settings'};
const DESC={transactions:'Catat penerimaan dan pengeluaran perusahaan per rekening.',accounts:'Pantau rekening perusahaan dan saldo kas aktual.',invoices:'Kelola piutang pelanggan dan pencatatan penerimaan pembayaran.',bills:'Kelola kewajiban vendor dan pembayaran tagihan.',budgets:'Tetapkan batas anggaran per departemen dan kategori.',departments:'Susun pusat biaya dan tim dalam perusahaan.',contacts:'Direktori pelanggan, vendor, dan relasi bisnis.',recurring:'Aturan pembukuan otomatis berdasarkan tanggal terjadwal.',approvals:'Pencatatan status permintaan persetujuan biaya.',payroll:'Perencanaan kompensasi; belum otomatis membukukan pembayaran.',taxes:'Pemantauan estimasi pajak dan tanggal jatuh tempo.',audit:'Riwayat tindakan data untuk tim finance.'};
const S={view:'dashboard',data:{},loaded:new Set(),orgs:[],org:null,user:null,auth:null,waiting:null,editing:false,modal:false,navSeq:0,orgSeq:0,loading:new Map(),errors:{},pendingConfirm:null};
let requestCounter=0;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>fmt.format(Number(n)||0),num=n=>Number(n)||0,today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},uuid=()=>crypto.randomUUID?crypto.randomUUID():'req-'+Date.now()+'-'+(++requestCounter),canWrite=()=>['owner','editor'].includes(S.org?.role),isOwner=()=>S.org?.role==='owner';
const getRows=t=>Array.isArray(S.data[t])?S.data[t]:[],pick=(t,id)=>getRows(t).find(r=>r.id===id)||{},labelFor=(t,id)=>{const r=pick(t,id);return r.name||r.number||r.email||'—'};
let auth;try{if(!cfg.firebase?.apiKey||cfg.firebase.apiKey.includes('PASTE_'))throw new Error('Konfigurasi Firebase belum diisi di config.js.');auth=getAuth(initializeApp(cfg.firebase));S.auth=auth;}catch(error){$('content').textContent=error.message;throw error;}
// Accessible premium toast: no untrusted HTML interpolation.
function toast(msg,bad=false){
  const host=$('toasts');if(!host)return;
  const div=document.createElement('div');
  div.className='aeris-notice '+(bad?'aeris-notice--error':'aeris-notice--success');
  div.setAttribute('role',bad?'alert':'status');
  const badge=document.createElement('span');badge.className='aeris-notice-symbol';badge.textContent=bad?'!':'✓';
  const body=document.createElement('div');body.className='aeris-notice-main';
  const heading=document.createElement('strong');heading.textContent=bad?'Tindakan tidak berhasil':'Berhasil';
  const text=document.createElement('p');text.textContent=String(msg||'');
  const close=document.createElement('button');close.type='button';close.className='aeris-notice-x';close.setAttribute('aria-label','Tutup notifikasi');close.textContent='×';
  body.append(heading,text);div.append(badge,body,close);
  let timer;const dismiss=()=>{clearTimeout(timer);div.classList.add('aeris-notice-out');setTimeout(()=>div.remove(),220);};
  close.addEventListener('click',dismiss);timer=setTimeout(dismiss,bad?8000:4200);
  host.prepend(div);while(host.children.length>4)host.lastElementChild.remove();
}
function skeleton(label='Menyinkronkan data perusahaan…'){
 return `<div class="view aeris-loading-page" role="status" aria-label="${esc(label)}"><section class="aeris-load-hero"><div><span class="aeris-load-kicker">✦ AERIS · CORPORATE FINANCE</span><h1>${esc(label)}</h1><p>Menyiapkan informasi keuangan dan laporan workspace.</p><div class="aeris-load-status"><i class="aeris-load-spinner"></i> Sinkronisasi data perusahaan <span class="aeris-load-dots">···</span></div></div><div class="aeris-load-side"><div class="aeris-skel" style="width:65%;height:13px"></div><div class="aeris-skel" style="width:88%;height:38px"></div><div class="aeris-skel" style="width:100%;height:1px"></div><div class="aeris-skel" style="width:54%;height:13px"></div></div></section><div class="aeris-load-stats">${[1,2,3,4].map(()=>`<div class="aeris-load-card"><div class="aeris-skel" style="width:55%;height:11px"></div><div class="aeris-skel" style="width:76%;height:30px"></div><div class="aeris-skel" style="width:40%;height:11px"></div></div>`).join('')}</div><div class="aeris-load-panels"><div class="aeris-load-panel"><div class="aeris-skel" style="height:13px;width:43%"></div><div class="aeris-load-chart">${[40,60,48,73,58,88,62,79].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div><div class="aeris-load-panel"><div class="aeris-skel" style="height:13px;width:50%"></div>${[1,2,3,4].map(()=>'<div class="aeris-load-item"><span class="aeris-skel" style="height:30px;width:32px"></span><span class="aeris-skel" style="height:11px;width:64%"></span></div>').join('')}</div></div></div>`;
}
const actionUrl=()=>{if(!cfg.appsScriptUrl||!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(cfg.appsScriptUrl))throw new Error('Isi appsScriptUrl yang valid di config.js.');return cfg.appsScriptUrl;};
async function rpc(action,payload={},orgId=S.org?.id){
 if(!auth.currentUser)throw new Error('Silakan login kembali.');
 const start=performance.now();
 const token=await getIdToken(auth.currentUser);
 const requestId=uuid(),url=actionUrl();
 return new Promise((resolve,reject)=>{
   const frame=document.createElement('iframe');frame.name='aeris_rpc_'+requestId;
   frame.style.cssText='position:fixed;width:1px;height:1px;left:-5px;top:-5px;opacity:0;pointer-events:none;border:0';frame.setAttribute('aria-hidden','true');
   const form=document.createElement('form');form.method='POST';form.target=frame.name;form.action=url;form.style.display='none';
   const add=(k,v)=>{const el=document.createElement('input');el.type='hidden';el.name=k;el.value=v;form.appendChild(el);};
   add('requestId',requestId);add('replyOrigin',location.origin);add('request',JSON.stringify({action,orgId,token,payload}));
   let done=false;
   const close=(err,value)=>{if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',listen);frame.remove();form.remove();
     console.info('[AERIS RPC]',action,Math.round(performance.now()-start),'ms',err?'FAILED':'SUCCESS');err?reject(err):resolve(value);};
   const listen=e=>{if(!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin)&&e.origin!=='https://script.google.com')return;
     const m=e.data;if(m?.channel!=='AERIS_RPC_V1'||m.requestId!==requestId)return;
     if(!m.result?.ok)return close(new Error(m.result?.error?.message||'Request ditolak.'));
     close(null,m.result.data);};
   const timer=setTimeout(()=>close(new Error('Backend belum merespons. Cek deployment dan koneksi internet.')),30000);
   window.addEventListener('message',listen);document.body.append(frame,form);
   try{form.submit();}catch(e){close(e);}
 });
}
// Render sidebar once; switching a view only updates its active state.
function updateNav(){
 const el=$('navigation');
 if(el.dataset.ready!=='1'){
   el.innerHTML=sections.map(g=>`<div class="nav-group">${g.label}</div>${g.items.map(([id,name,ico])=>`<button class="nav" data-view="${id}" type="button"><span class="ni">${ico}</span><span>${name}</span></button>`).join('')}`).join('');
   el.dataset.ready='1';
   el.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)void navigate(b.dataset.view);});
   // Warm lazy data on intent without preloading all modules.
   el.addEventListener('pointerover',e=>{const b=e.target.closest('[data-view]');if(!b||!S.org)return;const t=VIEW_TABLE[b.dataset.view];if(t&&!S.loaded.has(t))void loadTableOnce(t).catch(()=>{});});
 }
 el.querySelectorAll('[data-view]').forEach(b=>{const selected=b.dataset.view===S.view;b.classList.toggle('active',selected);if(selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 $('crumb').textContent=TITLES[S.view]||'Dashboard';
 $('profileName').textContent=S.user?.displayName?.split(' ')[0]||'Account';
 $('avatar').textContent=(S.user?.displayName||S.user?.email||'A').trim()[0].toUpperCase();
}
function closeSide(){$('sidebar').classList.remove('open');$('navOverlay').hidden=true;document.body.classList.remove('scroll-lock');}
$('menuBtn').addEventListener('click',()=>{$('sidebar').classList.add('open');$('navOverlay').hidden=false;document.body.classList.add('scroll-lock');});$('navOverlay').addEventListener('click',closeSide);$('closeSide').addEventListener('click',closeSide);$('quickAdd').addEventListener('click',()=>openForm('Transactions'));
$('refreshBtn').addEventListener('click',()=>refresh(true));$('profileBtn').addEventListener('click',()=>navigate('settings'));
function setSync(text){$('sync').innerHTML='<span class="live"></span>'+esc(text);}
async function boot(){
 S.user=auth.currentUser;updateNav();
 try{
   setSync('Memverifikasi akses');
   const resp=await rpc('listOrganizations');
   S.orgs=resp.organizations||[];
   if(!S.orgs.length){S.org=null;resetOrgData();renderOnboarding();setSync('Pilih organisasi');return;}
   const last=sessionStorage.getItem('aeris:lastOrg');
   S.org=S.orgs.find(o=>o.id===last)||S.orgs[0];
   await refresh(false);
 }catch(e){toast(e.message,true);$('content').innerHTML=`<div class="empty"><b>Gagal membuka workspace</b>${esc(e.message)}<div style="margin-top:20px"><button class="btn blue" id="retryBoot">Coba lagi</button></div></div>`;$('retryBoot')?.addEventListener('click',boot);}
}
// Single-flight module read, isolated by organization, with no stale-view commit.
async function loadTableOnce(table,{force=false}={}){
 if(!S.org)return [];
 if(!force&&S.loaded.has(table))return getRows(table);
 const orgId=S.org.id,epoch=S.orgSeq,key=orgId+':'+table;
 if(S.loading.has(key))return S.loading.get(key);
 const task=(async()=>{
   const response=await rpc('loadModule',{table,force:!!force},orgId);
   if(S.org?.id===orgId&&S.orgSeq===epoch){
     S.data[table]=response.rows||[];S.loaded.add(table);delete S.errors[table];
   }
   return response.rows||[];
 })();
 S.loading.set(key,task);
 try{return await task;}finally{if(S.loading.get(key)===task)S.loading.delete(key);}
}
function resetOrgData(){S.orgSeq++;S.navSeq++;S.data={};S.loaded.clear();S.errors={};S.loading.clear();}
async function refresh(forced=false){
 if(!S.org)return renderOnboarding();
 const orgId=S.org.id,epoch=S.orgSeq;
 setSync('Sinkronisasi…');
 if(!S.loaded.has('Accounts'))$('content').innerHTML=skeleton('Menyiapkan '+S.org.name);
 else render(); // stale-while-revalidate: keep visible data while fetching.
 try{
   const data=await rpc('snapshot',{force:!!forced},orgId);
   if(S.org?.id!==orgId||S.orgSeq!==epoch)return;
   Object.assign(S.data,data.data||{});
   (data.loadedTables||Object.keys(data.data||{})).forEach(t=>S.loaded.add(t));
   sessionStorage.setItem('aeris:lastOrg',orgId);
   if(forced){
     const active=VIEW_TABLE[S.view];
     if(active&&!((data.loadedTables||[]).includes(active))){
       try{await loadTableOnce(active,{force:true});}catch(err){toast('Modul masih menampilkan data sebelumnya: '+err.message,true);}
     }else if(S.view==='team'){try{await loadTeam();}catch(err){toast(err.message,true);}}
     else if(S.view==='audit'&&S.org?.role!=='viewer'){try{await loadAudit();}catch(err){toast(err.message,true);}}
   }
   if(S.org?.id!==orgId||S.orgSeq!==epoch)return;
   setSync('Sinkron '+String(data.serverTime||'').slice(11,16));render();
   if(forced)toast('Data perusahaan berhasil diperbarui.');
 }catch(e){
   if(S.org?.id!==orgId||S.orgSeq!==epoch)return;
   setSync('Gagal sinkron');toast(e.message,true);
   if(!S.loaded.has('Accounts'))$('content').innerHTML=`<div class="empty"><b>Data belum bisa dimuat</b>${esc(e.message)}<div style="margin-top:18px"><button class="btn blue" id="retryFetch">Coba lagi</button></div></div>`, $('retryFetch')?.addEventListener('click',()=>void refresh(true));
 }
}
async function navigate(view){
 if(!TITLES[view])return;
 const nav=++S.navSeq;
 S.view=view;closeSide();updateNav();
 if(!S.org){renderOnboarding();return;}
 const t=VIEW_TABLE[view];
 if(t&&!S.loaded.has(t)){
   render(); // shows premium module skeleton instantly; no old tab contents.
   try{await loadTableOnce(t);}catch(e){if(nav===S.navSeq){S.errors[t]=e.message;toast(e.message,true);}}
 }else if(view==='team'&&!S.loaded.has('Members')){
   render();try{await loadTeam();}catch(e){if(nav===S.navSeq){S.errors.Members=e.message;toast(e.message,true);}}

function compactMoney(value){
 const v=String(value),digits=Number(v.replace(/[^0-9-]/g,''));
 if(!Number.isFinite(digits)||v.length<14)return v;
 const signed=v.includes('-')?-1:1,n=Math.abs(digits),mark=n>=1e12?'T':n>=1e9?'M':n>=1e6?'jt':null,unit=n>=1e12?1e12:n>=1e9?1e9:1e6;
 if(!mark)return v;
 return (signed<0?'−':'')+'Rp'+new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(n/unit)+mark;
}
function kpi(label,value,detail,ico='◈',color=''){
 const shown=compactMoney(value);
 return `<div class="metric"><div class="metric-head"><label>${esc(label)}</label><span class="metric-icon">${ico}</span></div><strong class="${color}" title="${esc(value)}">${esc(shown)}</strong><p>${esc(detail)}</p></div>`;
}

function auditView(){const rows=getRows('Audit');return `<div class="view"><div class="view-intro"><div><span class="eyebrow" style="background:#eafbff;color:#168cc5">CONTROL & COMPLIANCE</span><h1 style="margin-top:12px">Audit Trail</h1><p>Perubahan penting dicatat untuk mendukung keterlacakan data perusahaan.</p></div></div><section class="panel"><div class="panel-head"><h3>Aktivitas Terakhir</h3><span class="chip">150 record terbaru</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>WAKTU</th><th>AKTOR</th><th>TINDAKAN</th><th>ENTITAS</th><th>DETAIL</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(String(r.time).replace('T',' ').slice(0,19))}</td><td>${esc(r.actor)}</td><td><span class="badge">${esc(r.action)}</span></td><td>${esc(r.table)}</td><td>${esc(r.details)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada riwayat aktivitas.</div>'}</section></div>`;}
function settings(){return `<div class="view"><div class="view-intro"><div><span class="eyebrow" style="background:#eafbff;color:#168cc5">WORKSPACE ADMINISTRATION</span><h1 style="margin-top:12px">Organization Settings</h1><p>Pengaturan identitas workspace, organisasi, dan keamanan akun.</p></div></div><div class="panels"><section class="panel"><h3>Current Organization</h3><div class="link-row"><div><small>PERUSAHAAN</small><strong>${esc(S.org.name)}</strong></div><span class="badge">${esc(S.org.role)}</span></div><label class="field" style="margin-top:16px"><span>Pindah organisasi</span><select class="select" id="orgSwitch">${S.orgs.map(o=>`<option value="${esc(o.id)}" ${o.id===S.org.id?'selected':''}>${esc(o.name)} (${esc(o.role)})</option>`).join('')}</select></label><div class="toolbar" style="margin-top:16px"><button class="btn blue" id="newOrgBtn">＋ Workspace baru / gabung</button><button class="btn" id="syncSettings">↻ Sinkronkan</button></div></section><section class="panel"><h3>User Profile</h3><div class="link-row"><div><small>NAMA</small><strong>${esc(S.user?.displayName||'Pengguna AERIS')}</strong></div></div><div class="link-row"><div><small>EMAIL</small><strong>${esc(S.user?.email)}</strong></div><span class="badge paid">Verified</span></div><button class="btn danger" id="logoutBtn" style="margin-top:18px">Keluar akun</button><p class="muted" style="margin-top:17px">Gunakan kebijakan akses organisasi dan pembatasan izin Google Drive untuk melindungi data bisnis. Google Apps Script adalah prototipe operasional, bukan pengganti kontrol akuntansi enterprise.</p></section></div></div>`;}
function render(){
 updateNav();if(!S.org)return renderOnboarding();
 const needed=VIEW_TABLE[S.view]||(S.view==='team'?'Members':S.view==='audit'?'Audit':(['dashboard','cashflow','reports'].includes(S.view)&&!S.loaded.has('Accounts')?'Accounts':null));
 if(needed&&!S.loaded.has(needed)){
   const error=S.errors[needed];
   $('content').innerHTML=error?`<section class="aeris-load-error"><div class="aeris-load-error-icon">!</div><h2>Modul belum dapat ditampilkan</h2><p>${esc(error)}</p><button class="btn blue" id="aerisRetryModule">↻ Coba lagi</button></section>`:skeleton('Memuat '+(TITLES[S.view]||needed)+'…');
   $('aerisRetryModule')?.addEventListener('click',()=>{delete S.errors[needed];S.loaded.delete(needed);void navigate(S.view);});
   return;
 }
 let html;
 if(S.view==='dashboard')html=dashboard();else if(S.view==='cashflow')html=cashflow();else if(S.view==='reports')html=reports();else if(S.view==='team')html=teamView();else if(S.view==='audit')html=auditView();else if(S.view==='settings')html=settings();else if(VIEW_TABLE[S.view])html=moduleView(VIEW_TABLE[S.view]);else html='<div class="empty">Modul tidak ditemukan.</div>';
 $('content').innerHTML=html+'<footer class="page-footer"><span>© AERIS Corporate Finance · Private Organization Workspace</span><span>Firebase Authentication · Google Apps Script · Google Sheets</span></footer>';
 attachViewEvents();
}
function attachViewEvents(){const root=$('content');root.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>openForm(b.dataset.add)));root.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(b.dataset.edit,b.dataset.id)));root.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>removeRecord(b.dataset.delete,b.dataset.id)));root.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click',()=>openPayment(b.dataset.pay,b.dataset.id)));root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.go)));root.querySelectorAll('[data-action=addTransaction]').forEach(b=>b.addEventListener('click',()=>openForm('Transactions')));root.querySelector('#tableSearch')?.addEventListener('input',e=>{const term=e.target.value.toLowerCase();root.querySelectorAll('tr[data-search]').forEach(tr=>tr.hidden=!tr.dataset.search.includes(term));});root.querySelector('#exportCsv')?.addEventListener('click',()=>exportCsv(VIEW_TABLE[S.view]));root.querySelector('#inviteBtn')?.addEventListener('click',openInvite);root.querySelectorAll('[data-member]').forEach(el=>el.addEventListener('change',()=>changeRole(el.dataset.member,el.value)));root.querySelector('#orgSwitch')?.addEventListener('change',async e=>{S.org=S.orgs.find(o=>o.id===e.target.value);resetOrgData();S.view='dashboard';await refresh();});root.querySelector('#newOrgBtn')?.addEventListener('click',()=>{S.org=null;resetOrgData();renderOnboarding();});root.querySelector('#syncSettings')?.addEventListener('click',()=>refresh(true));root.querySelector('#logoutBtn')?.addEventListener('click',async()=>{await signOut(auth);location.replace('index.html');});}
function fieldHTML(f,rec){const value=rec[f.name]??(f.type==='date'?today():f.type==='month'?today().slice(0,7):f.name==='currency'?'IDR':f.name==='active'?'true':f.name==='type'?'expense':f.name==='status'?'open':f.name==='frequency'?'monthly':'');const id='aeris_field_'+f.name,common=`name="${esc(f.name)}" id="${id}" ${f.required?'required':''}`;let control;if(f.type==='select'){control=`<select class="select" ${common}>${(f.items||[]).map(([v,label])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(label)}</option>`).join('')}</select>`;}else if(f.type==='textarea'){control=`<textarea class="textarea" ${common} maxlength="1500">${esc(value)}</textarea>`;}else if(f.type==='money'){control=`<input class="input" ${common} inputmode="numeric" autocomplete="off" data-money type="text" value="${esc(String(value||0).replace(/\B(?=(\d{3})+(?!\d))/g,'.'))}" placeholder="0">`;}else{control=`<input class="input" ${common} type="${esc(f.type)}" value="${esc(value)}" ${f.type==='text'?'maxlength="350"':''}>`;}return `<label class="field ${f.wide?'wide':''}"><span>${esc(f.label)}${f.required?' *':''}</span>${control}</label>`;}
let aerisModalFocus=null;
function openModal(title,subtitle,html,submitText='Simpan'){
 if(S.modal)closeModal();
 aerisModalFocus=document.activeElement;S.modal=true;
 const root=$('modalRoot');root.hidden=false;root.className='modal-root aeris-dialog-overlay';
 root.innerHTML=`<div class="modal aeris-dialog" role="dialog" aria-modal="true" aria-labelledby="aerisModalTitle" aria-describedby="aerisModalDescription"><header class="modal-head aeris-dialog-head"><div class="aeris-dialog-top"><span class="aeris-dialog-kicker"><span class="live"></span> AERIS · FINANCE OPERATIONS</span><button type="button" class="close aeris-dialog-close" id="modalClose" aria-label="Tutup dialog">×</button></div><div class="aeris-dialog-heading"><div class="aeris-dialog-mark" aria-hidden="true">✧</div><div><span class="aeris-dialog-eyebrow">SECURE CORPORATE WORKSPACE</span><h2 id="aerisModalTitle">${esc(title)}</h2><p id="aerisModalDescription">${esc(subtitle)}</p></div></div></header><div class="modal-body aeris-dialog-body"><div class="aeris-form-intro"><span class="aeris-form-index">01</span><div><strong>Detail informasi</strong><p>Lengkapi kolom berikut dengan informasi yang sesuai.</p></div></div>${html}<p class="aeris-form-security">♢ Data dikelola sesuai hak akses perusahaan. Kolom bertanda * wajib diisi.</p></div><footer class="modal-actions aeris-dialog-footer"><span class="aeris-dialog-safe"><span class="live"></span> Workspace privat</span><div class="aeris-dialog-buttons"><button class="btn" id="modalCancel" type="button">Batal</button><button class="btn blue" id="modalSubmit" type="submit" form="activeModalForm">✓ ${esc(submitText)}</button></div></footer></div>`;
 $('modalClose').addEventListener('click',closeModal);$('modalCancel').addEventListener('click',closeModal);
 root.addEventListener('click',e=>{if(e.target===root)closeModal();});
 root.querySelectorAll('[data-money]').forEach(input=>input.addEventListener('input',()=>{
   const nums=input.value.replace(/\D/g,'').slice(0,15);
   input.value=nums?Number(nums).toLocaleString('id-ID'):'';
   try{input.setSelectionRange(input.value.length,input.value.length);}catch(_){}
 }));
 root.addEventListener('keydown',e=>{if(e.key!=='Tab')return;
   const list=[...root.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')].filter(x=>x.getClientRects().length);
   if(!list.length)return;const first=list[0],last=list[list.length-1];
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
   else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 });
 document.body.classList.add('modal-open');
 requestAnimationFrame(()=>(root.querySelector('input:not([type=hidden]),select,textarea')||$('modalClose'))?.focus({preventScroll:true}));
}
function closeModal(){
 if(!S.modal)return;
 S.modal=false;$('modalRoot').hidden=true;$('modalRoot').replaceChildren();
 document.body.classList.remove('modal-open');
 if(S.pendingConfirm){const callback=S.pendingConfirm;S.pendingConfirm=null;callback(false);}
 if(aerisModalFocus?.isConnected)aerisModalFocus.focus({preventScroll:true});aerisModalFocus=null;
}
function aerisConfirm_(message,{title='Konfirmasi tindakan',danger=false}={}){
 return new Promise(resolve=>{
   openModal(title,'Pastikan tindakan ini memang ingin Anda lakukan.',`<form id="activeModalForm"><div class="aeris-confirm-panel"><span class="aeris-confirm-icon">${danger?'!':'?'}</span><p>${esc(message)}</p></div></form>`,danger?'Ya, lanjutkan':'Konfirmasi');
   S.pendingConfirm=resolve;
   if(danger)$('modalSubmit').classList.add('aeris-btn-danger');
   $('activeModalForm').addEventListener('submit',e=>{e.preventDefault();S.pendingConfirm=null;resolve(true);closeModal();});
 });
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();});
function openForm(table,id=''){if(!canWrite())return toast('Anda tidak memiliki izin menulis.',true);if(table==='Transactions'&&!getRows('Accounts').length){toast('Buat rekening perusahaan sebelum mencatat transaksi.',true);navigate('accounts');return;}const rec=id?pick(table,id):{},f=fields(table);if(id&&!rec.id)return toast('Data tidak ditemukan.',true);const label=Object.values(TITLES).includes(table)?table:Object.keys(VIEW_TABLE).find(x=>VIEW_TABLE[x]===table);const title=(id?'Edit ':'Tambah ')+(TITLES[label]||table);openModal(title,'Informasi tersimpan pada workspace perusahaan yang aktif.',`<form id="activeModalForm"><input type="hidden" name="id" value="${esc(id)}"><div class="form-grid">${f.map(v=>fieldHTML(v,rec)).join('')}</div></form>`,id?'Simpan perubahan':'Simpan data');$('activeModalForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,btn=$('modalSubmit');if(btn.disabled)return;const data=Object.fromEntries(new FormData(form));for(const x of f)if(x.type==='money')data[x.name]=String(data[x.name]||'').replace(/\D/g,'');if(!data.id)delete data.id;btn.disabled=true;try{const result=await rpc('upsert',{table,record:data,requestId:uuid()});closeModal();S.loaded.delete('Audit');toast('Data berhasil disimpan.');if(result.record){const rows=getRows(table).slice();const idx=rows.findIndex(r=>r.id===result.record.id);if(idx>=0)rows[idx]=result.record;else rows.unshift(result.record);S.data[table]=rows;S.loaded.add(table);render();if(table==='Transactions'||table==='Accounts'){render();}}else await reloadTable(table);}catch(err){toast(err.message,true);btn.disabled=false;}});}
async function reloadTable(table){try{const org=S.org.id;const result=await rpc('loadModule',{table},org);if(org!==S.org.id)return;S.data[table]=result.rows||[];S.loaded.add(table);if(table==='Transactions'||table==='Accounts')await reloadDependency();render();}catch(err){toast('Tersimpan, tetapi belum tersinkron: '+err.message,true);await refresh();}}
async function reloadDependency(){/* Balance uses existing Accounts + Transactions; no redundant request needed. */}
async function removeRecord(table,id){
 if(!isOwner())return toast('Hanya owner yang boleh menghapus.',true);
 if(!await aerisConfirm_('Hapus catatan ini secara permanen? Tindakan akan masuk ke Audit Trail.',{title:'Hapus data perusahaan',danger:true}))return;
 try{await rpc('remove',{table,id,requestId:uuid()});S.data[table]=getRows(table).filter(x=>x.id!==id);S.loaded.delete('Audit');toast('Data berhasil dihapus.');render();}catch(e){toast(e.message,true);}
}
function openPayment(table,id){if(!canWrite())return;const doc=pick(table,id);const accounts=getRows('Accounts');if(!accounts.length)return toast('Tambahkan rekening lebih dulu.',true);openModal('Catat Pembayaran '+doc.number,'Mencatat pembayaran sekaligus membuat transaksi kas agar saldo berubah.',`<form id="activeModalForm"><div class="form-grid"><label class="field"><span>Rekening ${table==='Invoices'?'penerimaan':'pembayaran'}</span><select class="select" name="accountId" required>${accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></label><label class="field"><span>Tanggal pembayaran</span><input class="input" type="date" name="date" required value="${today()}"></label><div class="field wide"><span>Nilai dokumen</span><div style="font-size:24px;font-weight:800">${money(doc.amount)}</div></div></div></form>`,'Catat pembayaran');$('activeModalForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('modalSubmit');btn.disabled=true;try{const p=Object.fromEntries(new FormData(e.currentTarget));const paid=await rpc('recordPayment',{...p,table,id,requestId:uuid()});closeModal();S.loaded.delete('Audit');toast('Pembayaran tercatat dan kas sudah diperbarui.');if(paid.document&&paid.transaction){S.data[table]=getRows(table).map(d=>d.id===id?paid.document:d);S.data.Transactions=[...getRows('Transactions'),paid.transaction];S.loaded.add('Transactions');render();}else{await reloadTable(table);await loadTableOnce('Transactions',{force:true});render();}}catch(err){toast(err.message,true);btn.disabled=false;}});}
function exportCsv(table){const rows=getRows(table);if(!rows.length)return toast('Tidak ada data untuk diekspor.');const head=Object.keys(rows[0]),cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const csv='\ufeff'+head.map(cell).join(',')+'\r\n'+rows.map(r=>head.map(k=>cell(r[k])).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='aeris-'+table.toLowerCase()+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function openInvite(){if(!isOwner())return;openModal('Undang Anggota','Undangan hanya berlaku bagi alamat email yang dituju selama tujuh hari.',`<form id="activeModalForm"><div class="form-grid"><label class="field wide"><span>Email calon anggota</span><input class="input" type="email" name="email" placeholder="finance@perusahaan.com" required></label><label class="field wide"><span>Hak akses</span><select class="select" name="role"><option value="editor">Editor — bisa tambah dan edit</option><option value="viewer">Viewer — baca saja</option></select></label></div><div id="inviteResult" class="muted" style="margin-top:15px"></div></form>`,'Buat kode undangan');$('activeModalForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('modalSubmit');btn.disabled=true;try{const res=await rpc('invite',Object.fromEntries(new FormData(e.currentTarget)));$('inviteResult').textContent='Kode undangan: '+res.code+' — berlaku hingga '+res.expiresAt.slice(0,10)+'. Berikan secara pribadi ke '+res.email+'.';toast('Kode undangan berhasil dibuat.');btn.textContent='Selesai';btn.disabled=true;}catch(err){toast(err.message,true);btn.disabled=false;}});}
async function changeRole(id,role){
 if(!role)return;
 if(role==='remove'&&!await aerisConfirm_('Cabut akses anggota ini dari perusahaan?',{title:'Cabut akses anggota',danger:true})){render();return;}
 try{await rpc('setRole',{id,role});toast('Akses anggota telah diperbarui.');S.loaded.delete('Members');await loadTeam();render();}catch(e){toast(e.message,true);render();}
}
// Firebase guards the visible interface; backend independently verifies token + company role.
onAuthStateChanged(auth,async user=>{if(!user){location.replace('index.html');return;}if(!user.emailVerified){await user.reload().catch(()=>{});if(!auth.currentUser?.emailVerified){location.replace('verify.html');return;}}S.user=auth.currentUser;await boot();});
</script></body></html>
