function budgetSpent(b){return getRows('Transactions').filter(t=>t.type==='expense'&&String(t.date).startsWith(b.period||'')&&(!b.category||b.category===t.category)&&(!b.departmentId||b.departmentId===t.departmentId)).reduce((s,t)=>s+num(t.amount),0);}
function cell(table,r,key){let v=r[key];if(key==='balance')v=actualBalance(r);if(key==='spent')v=budgetSpent(r);if(['amount','openingBalance','limitAmount','gross','deductions','balance','spent'].includes(key))return `<strong>${esc(money(v))}</strong>`;if(key==='accountId')return esc(labelFor('Accounts',v));if(key==='departmentId')return esc(labelFor('Departments',v));if(key==='customerId'||key==='vendorId'||key==='contactId')return esc(labelFor('Contacts',v));if(key==='status')return `<span class="badge ${esc(v)}">${esc(String(v||'draft').toUpperCase())}</span>`;if(key==='active')return `<span class="badge ${String(v)==='true'?'approved':'pending'}">${String(v)==='true'?'AKTIF':'NONAKTIF'}</span>`;if(key==='type')return `<span class="badge ${v==='income'?'approved':v==='expense'?'overdue':''}">${esc(v)}</span>`;return esc(v||'—');}
function dataTable(table){const rows=getRows(table),cols=TCOL[table]||[],action=canWrite();return `<div class="panel"><div class="panel-head"><div><h3>Data ${esc(TITLES[S.view]||table)}</h3><div class="muted" style="margin-top:5px">${rows.length} catatan tersimpan dalam Google Sheets organisasi</div></div><div class="toolbar"><input class="input" id="tableSearch" placeholder="Cari data…" aria-label="Cari data" style="min-height:34px;width:175px"><button class="btn sm" id="exportCsv">↓ Ekspor CSV</button></div></div>${!rows.length?`<div class="empty"><b>Belum ada data</b>${canWrite()?'Klik tombol Tambah untuk mulai mengisi modul ini.':'Hubungi pemilik untuk menambahkan data.'}</div>`:`<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}<th>AKSI</th></tr></thead><tbody>${rows.map(r=>`<tr data-search="${esc(Object.values(r).join(' ').toLowerCase())}">${cols.map(c=>`<td>${cell(table,r,c[0])}</td>`).join('')}<td><div class="toolbar">${action&&!(r.status==='paid'&&['Bills','Invoices'].includes(table))?`<button class="btn sm" data-edit="${esc(table)}" data-id="${esc(r.id)}">Edit</button>`:''}${action&&['Bills','Invoices'].includes(table)&&!['paid','cancelled'].includes(r.status)?`<button class="btn sm blue" data-pay="${esc(table)}" data-id="${esc(r.id)}">Catat pembayaran</button>`:''}${isOwner()?`<button class="btn sm danger" data-delete="${esc(table)}" data-id="${esc(r.id)}">Hapus</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}</div>`;}
function moduleView(table){const rows=getRows(table),c=TCOL[table],amountKey={Accounts:'balance',Transactions:'amount',Invoices:'amount',Bills:'amount',Budgets:'limitAmount',Recurring:'amount',Approvals:'amount',Payroll:'gross',Taxes:'amount'}[table];let total=0;if(amountKey)total=rows.reduce((s,r)=>s+(amountKey==='balance'?actualBalance(r):num(r[amountKey])),0);return `<div class="view"><div class="view-intro"><div><span class="eyebrow" style="color:#288dba;border-color:#c4eaf9;background:#eafbff">AERIS / BUSINESS OPERATIONS</span><h1 style="margin-top:13px">${esc(TITLES[S.view])}</h1><p>${esc(DESC[S.view]||'Kelola dan analisis data perusahaan Anda.')}</p></div>${canWrite()?`<button class="btn blue" data-add="${esc(table)}">＋ Tambah Data</button>`:''}</div><div class="mini-grid" style="margin-bottom:17px"><div class="panel"><div class="muted">TOTAL DATA</div><strong>${rows.length} Record</strong></div><div class="panel"><div class="muted">${amountKey?'JUMLAH TERCATAT':'DATA ORGANISASI'}</div><strong>${amountKey?money(total):S.org.name}</strong></div><div class="panel"><div class="muted">HAK AKSES</div><strong style="text-transform:capitalize">${esc(S.org.role)}</strong></div></div>${dataTable(table)}${table==='Invoices'||table==='Bills'?'<div class="muted" style="margin-top:14px">Pembayaran baru memengaruhi saldo kas setelah Anda menekan “Catat pembayaran”. Penanda status saja tidak otomatis memindahkan uang.</div>':''}${table==='Payroll'||table==='Taxes'||table==='Approvals'?'<div class="muted" style="margin-top:14px">Modul ini adalah tracker administratif; tidak otomatis membuat transaksi kas atau perhitungan pajak resmi.</div>':''}</div>`;}
function reports(){const t=totals(),acc=getRows('Accounts'),inv=getRows('Invoices'),bills=getRows('Bills');return `<div class="view"><section class="hero"><div><span class="eyebrow">FINANCIAL REPORTING & INSIGHTS</span><h1>Corporate Financial Reports</h1><p>Ringkasan kas dan kewajiban berdasarkan catatan transaksi serta dokumen organisasi.</p></div><div class="hero-side"><span>NET CASH FLOW · THIS MONTH</span><strong>${money(t.net)}</strong><footer><span>Cash-basis operational view</span></footer></div></section><div class="section-title"><h2>Financial Performance</h2></div><div class="metric-grid">${kpi('SALDO AKHIR KAS',money(t.balance),'Saldo setelah transaksi')}${kpi('PIUTANG TERBUKA',money(t.receivable),'Total invoice belum lunas')}${kpi('UTANG TERBUKA',money(t.payable),'Total tagihan belum dibayar')}${kpi('NET CASHFLOW',money(t.net),'Bulan ini')}</div><div class="panels"><section class="panel"><div class="panel-head"><h3>Monthly Operating Flow</h3><span class="chip">6-month analysis</span></div>${chart()}</section><section class="panel"><div class="panel-head"><h3>Bank Balance Reconciliation</h3><span class="chip">Ledger summary</span></div>${acc.length?acc.map(a=>`<div class="link-row"><div><strong>${esc(a.name)}</strong><small>${esc(a.type)} · ${esc(a.currency)}</small></div><span class="money">${money(actualBalance(a))}</span></div>`).join(''):'<div class="empty">Belum ada rekening.</div>'}</section></div><div class="muted" style="margin-top:15px">Laporan ini menggunakan metode arus kas, bukan laporan laba rugi akrual, neraca akuntansi lengkap, maupun laporan keuangan yang telah diaudit. Piutang dan utang ditampilkan terpisah dari kas.</div></div>`;}
function teamView(){const rows=getRows('Members');return `<div class="view"><div class="view-intro"><div><span class="eyebrow" style="background:#eafbff;color:#1385bf">TEAM & ACCESS CONTROL</span><h1 style="margin-top:12px">Team & Access</h1><p>Kolaborasi satu perusahaan dengan hak akses Owner, Editor, dan Viewer.</p></div>${isOwner()?'<button class="btn blue" id="inviteBtn">＋ Undang anggota</button>':''}</div><section class="panel"><div class="panel-head"><h3>Anggota Organisasi</h3><span class="chip">${rows.length} anggota</span></div>${rows.map(m=>`<div class="link-row"><div><strong>${esc(m.email)}</strong><small>Sejak ${esc(String(m.joinedAt).slice(0,10))}</small></div><div class="toolbar"><span class="badge">${esc(m.role)}</span>${isOwner()&&m.role!=='owner'?`<select class="select" style="width:108px;min-height:34px" data-member="${esc(m.id)}"><option value="">Ubah role</option><option value="editor">Editor</option><option value="viewer">Viewer</option><option value="remove">Hapus akses</option></select>`:''}</div></div>`).join('')||'<div class="empty">Belum ada anggota lain.</div>'}</section><div class="panel" style="margin-top:18px"><h3>Role Permissions</h3><div class="link-row"><strong>Owner</strong><span class="muted">Akses penuh termasuk undangan dan penghapusan data</span></div><div class="link-row"><strong>Editor</strong><span class="muted">Lihat, tambah, dan edit transaksi serta catatan</span></div><div class="link-row"><strong>Viewer</strong><span class="muted">Hanya baca laporan dan data perusahaan</span></div></div></div>`;}
function auditView(){const rows=getRows('Audit');return `<div class="view"><div class="view-intro"><div><span class="eyebrow" style="background:#eafbff;color:#168cc5">CONTROL & COMPLIANCE</span><h1 style="margin-top:12px">Audit Trail</h1><p>Perubahan penting dicatat untuk mendukung keterlacakan data perusahaan.</p></div></div><section class="panel"><div class="panel-head"><h3>Aktivitas Terakhir</h3><span class="chip">150 record terbaru</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>WAKTU</th><th>AKTOR</th><th>TINDAKAN</th><th>ENTITAS</th><th>DETAIL</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(String(r.time).replace('T',' ').slice(0,19))}</td><td>${esc(r.actor)}</td><td><span class="badge">${esc(r.action)}</span></td><td>${esc(r.table)}</td><td>${esc(r.details)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada riwayat aktivitas.</div>'}</section></div>`;}
function settings(){return `<div class="view"><div class="view-intro"><div><span class="eyebrow" style="background:#eafbff;color:#168cc5">WORKSPACE ADMINISTRATION</span><h1 style="margin-top:12px">Organization Settings</h1><p>Pengaturan identitas workspace, organisasi, dan keamanan akun.</p></div></div><div class="panels"><section class="panel"><h3>Current Organization</h3><div class="link-row"><div><small>PERUSAHAAN</small><strong>${esc(S.org.name)}</strong></div><span class="badge">${esc(S.org.role)}</span></div><label class="field" style="margin-top:16px"><span>Pindah organisasi</span><select class="select" id="orgSwitch">${S.orgs.map(o=>`<option value="${esc(o.id)}" ${o.id===S.org.id?'selected':''}>${esc(o.name)} (${esc(o.role)})</option>`).join('')}</select></label><div class="toolbar" style="margin-top:16px"><button class="btn blue" id="newOrgBtn">＋ Workspace baru / gabung</button><button class="btn" id="syncSettings">↻ Sinkronkan</button></div></section><section class="panel"><h3>User Profile</h3><div class="link-row"><div><small>NAMA</small><strong>${esc(S.user?.displayName||'Pengguna AERIS')}</strong></div></div><div class="link-row"><div><small>EMAIL</small><strong>${esc(S.user?.email)}</strong></div><span class="badge paid">Verified</span></div><button class="btn danger" id="logoutBtn" style="margin-top:18px">Keluar akun</button><p class="muted" style="margin-top:17px">Gunakan kebijakan akses organisasi dan pembatasan izin Google Drive untuk melindungi data bisnis. Google Apps Script adalah prototipe operasional, bukan pengganti kontrol akuntansi enterprise.</p></section></div></div>`;}
function render(){updateNav();if(!S.org)return renderOnboarding();let html;if(S.view==='dashboard')html=dashboard();else if(S.view==='cashflow')html=cashflow();else if(S.view==='reports')html=reports();else if(S.view==='team')html=teamView();else if(S.view==='audit')html=auditView();else if(S.view==='settings')html=settings();else if(VIEW_TABLE[S.view])html=moduleView(VIEW_TABLE[S.view]);else html='<div class="empty">Modul tidak ditemukan.</div>';$('content').innerHTML=html+'<footer class="page-footer"><span>© AERIS Corporate Finance · Private Organization Workspace</span><span>Firebase Authentication · Google Apps Script · Google Sheets</span></footer>';attachViewEvents();}
function attachViewEvents(){const root=$('content');root.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>openForm(b.dataset.add)));root.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(b.dataset.edit,b.dataset.id)));root.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>removeRecord(b.dataset.delete,b.dataset.id)));root.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click',()=>openPayment(b.dataset.pay,b.dataset.id)));root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.go)));root.querySelectorAll('[data-action=addTransaction]').forEach(b=>b.addEventListener('click',()=>openForm('Transactions')));root.querySelector('#tableSearch')?.addEventListener('input',e=>{const term=e.target.value.toLowerCase();root.querySelectorAll('tr[data-search]').forEach(tr=>tr.hidden=!tr.dataset.search.includes(term));});root.querySelector('#exportCsv')?.addEventListener('click',()=>exportCsv(VIEW_TABLE[S.view]));root.querySelector('#inviteBtn')?.addEventListener('click',openInvite);root.querySelectorAll('[data-member]').forEach(el=>el.addEventListener('change',()=>changeRole(el.dataset.member,el.value)));root.querySelector('#orgSwitch')?.addEventListener('change',async e=>{S.org=S.orgs.find(o=>o.id===e.target.value);S.loaded.clear();S.view='dashboard';await refresh();});root.querySelector('#newOrgBtn')?.addEventListener('click',()=>{S.org=null;renderOnboarding();});root.querySelector('#syncSettings')?.addEventListener('click',()=>refresh(true));root.querySelector('#logoutBtn')?.addEventListener('click',async()=>{await signOut(auth);location.replace('index.html');});}
function fieldHTML(f,rec){const value=rec[f.name]??(f.type==='date'?today():f.type==='month'?today().slice(0,7):f.name==='currency'?'IDR':f.name==='active'?'true':f.name==='type'?'expense':f.name==='status'?'open':f.name==='frequency'?'monthly':'');const id='aeris_field_'+f.name,common=`name="${esc(f.name)}" id="${id}" ${f.required?'required':''}`;let control;if(f.type==='select'){control=`<select class="select" ${common}>${(f.items||[]).map(([v,label])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(label)}</option>`).join('')}</select>`;}else if(f.type==='textarea'){control=`<textarea class="textarea" ${common} maxlength="1500">${esc(value)}</textarea>`;}else if(f.type==='money'){control=`<input class="input" ${common} inputmode="numeric" autocomplete="off" data-money type="text" value="${esc(String(value||0).replace(/\B(?=(\d{3})+(?!\d))/g,'.'))}" placeholder="0">`;}else{control=`<input class="input" ${common} type="${esc(f.type)}" value="${esc(value)}" ${f.type==='text'?'maxlength="350"':''}>`;}return `<label class="field ${f.wide?'wide':''}"><span>${esc(f.label)}${f.required?' *':''}</span>${control}</label>`;}
function openModal(title,subtitle,html,submitText='Simpan'){if(S.modal)closeModal();S.modal=true;$('modalRoot').hidden=false;$('modalRoot').className='modal-root';$('modalRoot').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><span class="eyebrow">✦ AERIS · CORPORATE FINANCE</span><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button type="button" class="close" id="modalClose" aria-label="Tutup">×</button></div><div class="modal-body">${html}</div><div class="modal-actions"><button class="btn" id="modalCancel" type="button">Batal</button><button class="btn blue" id="modalSubmit" type="submit" form="activeModalForm">${esc(submitText)}</button></div></div>`;$('modalClose').addEventListener('click',closeModal);$('modalCancel').addEventListener('click',closeModal);$('modalRoot').addEventListener('click',e=>{if(e.target===$('modalRoot'))closeModal();});$('modalRoot').querySelectorAll('[data-money]').forEach(input=>input.addEventListener('input',()=>{const start=input.selectionStart;const prev=input.value;const nums=prev.replace(/\D/g,'').slice(0,16);input.value=nums?Number(nums).toLocaleString('id-ID'):'';input.setSelectionRange(input.value.length,input.value.length);}));$('modalRoot').querySelector('input:not([type=hidden]),select')?.focus({preventScroll:true});document.body.classList.add('modal-open');}
function closeModal(){S.modal=false;$('modalRoot').hidden=true;$('modalRoot').innerHTML='';document.body.classList.remove('modal-open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();});
function openForm(table,id=''){if(!canWrite())return toast('Anda tidak memiliki izin menulis.',true);if(table==='Transactions'&&!getRows('Accounts').length){toast('Buat rekening perusahaan sebelum mencatat transaksi.',true);navigate('accounts');return;}const rec=id?pick(table,id):{},f=fields(table);if(id&&!rec.id)return toast('Data tidak ditemukan.',true);const label=Object.values(TITLES).includes(table)?table:Object.keys(VIEW_TABLE).find(x=>VIEW_TABLE[x]===table);const title=(id?'Edit ':'Tambah ')+(TITLES[label]||table);openModal(title,'Informasi tersimpan pada workspace perusahaan yang aktif.',`<form id="activeModalForm"><input type="hidden" name="id" value="${esc(id)}"><div class="form-grid">${f.map(v=>fieldHTML(v,rec)).join('')}</div></form>`,id?'Simpan perubahan':'Simpan data');$('activeModalForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,btn=$('modalSubmit');if(btn.disabled)return;const data=Object.fromEntries(new FormData(form));for(const x of f)if(x.type==='money')data[x.name]=String(data[x.name]||'').replace(/\D/g,'');if(!data.id)delete data.id;btn.disabled=true;try{await rpc('upsert',{table,record:data,requestId:uuid()});closeModal();toast('Data berhasil disimpan.');await reloadTable(table);}catch(err){toast(err.message,true);btn.disabled=false;}});}
async function reloadTable(table){try{const org=S.org.id;const result=await rpc('loadModule',{table},org);if(org!==S.org.id)return;S.data[table]=result.rows||[];S.loaded.add(table);if(table==='Transactions'||table==='Accounts')await reloadDependency();render();}catch(err){toast('Tersimpan, tetapi belum tersinkron: '+err.message,true);await refresh();}}
async function reloadDependency(){/* Balance uses existing Accounts + Transactions; no redundant request needed. */}
async function removeRecord(table,id){if(!isOwner())return toast('Hanya owner yang boleh menghapus.',true);if(!confirm('Yakin menghapus data ini? Riwayat tindakan akan dicatat.'))return;try{await rpc('remove',{table,id,requestId:uuid()});toast('Data dihapus.');await reloadTable(table);}catch(e){toast(e.message,true);}}
function openPayment(table,id){if(!canWrite())return;const doc=pick(table,id);const accounts=getRows('Accounts');if(!accounts.length)return toast('Tambahkan rekening lebih dulu.',true);openModal('Catat Pembayaran '+doc.number,'Mencatat pembayaran sekaligus membuat transaksi kas agar saldo berubah.',`<form id="activeModalForm"><div class="form-grid"><label class="field"><span>Rekening ${table==='Invoices'?'penerimaan':'pembayaran'}</span><select class="select" name="accountId" required>${accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></label><label class="field"><span>Tanggal pembayaran</span><input class="input" type="date" name="date" required value="${today()}"></label><div class="field wide"><span>Nilai dokumen</span><div style="font-size:24px;font-weight:800">${money(doc.amount)}</div></div></div></form>`,'Catat pembayaran');$('activeModalForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('modalSubmit');btn.disabled=true;try{const p=Object.fromEntries(new FormData(e.currentTarget));await rpc('recordPayment',{...p,table,id,requestId:uuid()});closeModal();toast('Pembayaran tercatat dan kas sudah diperbarui.');await reloadTable(table);const r=await rpc('loadModule',{table:'Transactions'});S.data.Transactions=r.rows||[];S.loaded.add('Transactions');render();}catch(err){toast(err.message,true);btn.disabled=false;}});}
function exportCsv(table){const rows=getRows(table);if(!rows.length)return toast('Tidak ada data untuk diekspor.');const head=Object.keys(rows[0]),cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const csv='\ufeff'+head.map(cell).join(',')+'\r\n'+rows.map(r=>head.map(k=>cell(r[k])).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='aeris-'+table.toLowerCase()+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function openInvite(){if(!isOwner())return;openModal('Undang Anggota','Undangan hanya berlaku bagi alamat email yang dituju selama tujuh hari.',`<form id="activeModalForm"><div class="form-grid"><label class="field wide"><span>Email calon anggota</span><input class="input" type="email" name="email" placeholder="finance@perusahaan.com" required></label><label class="field wide"><span>Hak akses</span><select class="select" name="role"><option value="editor">Editor — bisa tambah dan edit</option><option value="viewer">Viewer — baca saja</option></select></label></div><div id="inviteResult" class="muted" style="margin-top:15px"></div></form>`,'Buat kode undangan');$('activeModalForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('modalSubmit');btn.disabled=true;try{const res=await rpc('invite',Object.fromEntries(new FormData(e.currentTarget)));$('inviteResult').textContent='Kode undangan: '+res.code+' — berlaku hingga '+res.expiresAt.slice(0,10)+'. Berikan secara pribadi ke '+res.email+'.';toast('Kode undangan berhasil dibuat.');btn.textContent='Selesai';btn.disabled=true;}catch(err){toast(err.message,true);btn.disabled=false;}});}
async function changeRole(id,role){if(!role)return;if(role==='remove'&&!confirm('Cabut akses anggota ini dari perusahaan?')){render();return;}try{await rpc('setRole',{id,role});toast('Akses anggota telah diperbarui.');await loadTeam();render();}catch(e){toast(e.message,true);render();}}
// Firebase guards the visible interface; backend independently verifies token + company role.
onAuthStateChanged(auth,async user=>{if(!user){location.replace('index.html');return;}await user.reload().catch(()=>{});if(!auth.currentUser?.emailVerified){location.replace('verify.html');return;}S.user=auth.currentUser;await boot();});
</script></body></html>
